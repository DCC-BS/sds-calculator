<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digitale Souveränität - Checkliste & Berechnung</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="sheet" aria-labelledby="page-title">
    <header class="sheet__header">
      <img class="sheet__logo" src="baselstab.svg" alt="Kanton Basel-Stadt">
      <span class="sheet__divider" aria-hidden="true"></span>
      <div class="sheet__title-group">
        <h1 class="sheet__title" id="page-title">Digitale Souveränität - Checkliste & Berechnung</h1>
      </div>
    </header>

    <section class="form-section" aria-labelledby="software-label">
      <div class="software-name">
        <span></span>
        <label class="software-name__label" for="softwareName" id="software-label">Name der geprüften Software</label>
        <input class="software-name__input" id="softwareName" name="softwareName" type="text" autocomplete="off">
      </div>
    </section>

    <section class="calculator" aria-describedby="page-description">
      <div class="calculator__head" aria-hidden="true">
        <span></span>
        <span>Dimension</span>
        <span>Frage</span>
        <span class="answer-head">Antwort</span>
      </div>

      <form class="questions" id="questionsForm" aria-label="Fragen zur digitalen Souveränität"></form>
    </section>

    <section class="score" aria-labelledby="score-title" aria-live="polite">
      <div>
        <h2 class="score__title" id="score-title">Score der Digitalen Souveränität (SDS)</h2>
        <p class="score__meta" id="scoreMeta">0 von 100 gewichteten Punkten</p>
      </div>
      <output class="score__box" id="scoreNumber" for="questionsForm">1</output>
      <div class="score__footer">
        <span class="score__label" id="scoreLabel"></span>
        <span class="score__flags" id="scoreFlags" hidden></span>
      </div>
    </section>

    <section class="share" id="shareSection" aria-label="Link teilen">
      <button class="button button--secondary" id="copyLink" type="button">Link kopieren</button>
      <span class="share__status" id="copyStatus" role="status" aria-live="polite"></span>
      <button class="button button--secondary share__reset" id="resetButton" type="button">Zurücksetzen</button>
    </section>

    <section class="notes" aria-labelledby="notes-title">
      <h2 class="notes__title" id="notes-title">Hinweise</h2>
      <ol class="notes__list" id="notesList"></ol>
    </section>
  </main>

  <template id="questionTemplate">
    <fieldset class="question-card">
      <legend class="sr-only"></legend>
      <span class="question-card__index" aria-hidden="true"></span>
      <span class="question-card__dimension"></span>
      <div class="question-card__question">
        <span class="question-card__text"></span>
        <span class="question-card__weight"></span>
        <p class="question-card__help"></p>
      </div>
      <div class="question-card__answers"></div>
    </fieldset>
  </template>

  <script src="questions.js"></script>
  <script src="index.js" defer></script>
</body>
</html>
